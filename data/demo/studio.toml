[[node]]
name = "Talkback"
class = "Audio/Source/Virtual"
outputs = ["capture_MONO"]

[[node]]
name = "Firefox"
class = "Stream/Output/Audio"
app = "Firefox"
outputs = ["output_FL", "output_FR"]

[[node]]
key = "audacity"
name = "Audacity Recording"
class = "Stream/Input/Audio"
app = "Audacity"
inputs = ["input_FL", "input_FR"]

[[node]]
key = "jam-in"
name = "Jamulus Send"
class = "Stream/Input/Audio"
