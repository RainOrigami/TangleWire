# A music studio: two audio interfaces, a DAW, a plugin rack, hardware
# synths over MIDI, and outboard gear on send and return.

[[device]]
key = "clarett"
name = "Clarett+ 8Pre"
vendor = "Focusrite"

[[device]]
key = "fireface"
name = "Fireface UCX II"
vendor = "RME"

[[device]]
key = "midi"
name = "MIDI Express XT"
vendor = "MOTU"

[[device]]
key = "push"
name = "Push 2"
vendor = "Ableton"

[[device]]
key = "keys"
name = "Keystation 88 MK3"
vendor = "M-Audio"

[[node]]
key = "clarett-in"
name = "Clarett+ 8Pre Inputs"
class = "Audio/Source"
device = "clarett"
outputs = ["capture_AUX0", "capture_AUX1", "capture_AUX2", "capture_AUX3", "capture_AUX4", "capture_AUX5", "capture_AUX6", "capture_AUX7"]

[[node]]
key = "clarett-out"
name = "Clarett+ 8Pre Outputs"
class = "Audio/Sink"
device = "clarett"
inputs = ["playback_AUX0", "playback_AUX1", "playback_AUX2", "playback_AUX3", "playback_AUX4", "playback_AUX5", "playback_AUX6", "playback_AUX7", "playback_AUX8", "playback_AUX9"]

[[node]]
key = "ff-in"
name = "Fireface UCX II Inputs"
class = "Audio/Source"
device = "fireface"
outputs = ["capture_AUX0", "capture_AUX1", "capture_AUX2", "capture_AUX3", "capture_AUX4", "capture_AUX5", "capture_AUX6", "capture_AUX7"]

[[node]]
key = "ff-out"
name = "Fireface UCX II Outputs"
class = "Audio/Sink"
device = "fireface"
inputs = ["playback_AUX0", "playback_AUX1", "playback_AUX2", "playback_AUX3", "playback_AUX4", "playback_AUX5", "playback_AUX6", "playback_AUX7"]

[[node]]
key = "daw-in"
name = "Bitwig Studio Inputs"
class = "Stream/Input/Audio"
app = "Bitwig Studio"
inputs = ["in1", "in2", "in3", "in4", "in5", "in6", "in7", "in8", "in9", "in10", "in11", "in12", "in13", "in14", "in15", "in16"]

[[node]]
key = "daw-out"
name = "Bitwig Studio Outputs"
class = "Stream/Output/Audio"
app = "Bitwig Studio"
outputs = ["out1", "out2", "out3", "out4", "out5", "out6", "out7", "out8", "out9", "out10", "out11", "out12"]

[[node]]
key = "daw-midi"
name = "Bitwig Studio MIDI"
class = "Midi/Bridge"
app = "Bitwig Studio"
kind = "midi"
inputs = ["midi_in1", "midi_in2", "midi_in3", "midi_in4"]
outputs = ["midi_out1", "midi_out2", "midi_out3", "midi_out4", "midi_out5", "midi_out6"]

[[node]]
key = "mx"
name = "MIDI Express XT"
class = "Midi/Bridge"
device = "midi"
kind = "midi"
inputs = ["Port 1 (playback)", "Port 2 (playback)", "Port 3 (playback)", "Port 4 (playback)", "Port 5 (playback)", "Port 6 (playback)"]
outputs = ["Port 1 (capture)", "Port 2 (capture)"]

[[node]]
key = "keystation"
name = "Keystation 88 MK3"
class = "Midi/Bridge"
device = "keys"
kind = "midi"
outputs = ["USB MIDI (capture)", "Transport (capture)"]

[[node]]
key = "push2"
name = "Push 2"
class = "Midi/Bridge"
device = "push"
kind = "midi"
inputs = ["Live Port (playback)", "User Port (playback)"]
outputs = ["Live Port (capture)", "User Port (capture)"]

[[node]]
key = "launchpad"
name = "Launchpad Pro"
class = "Midi/Bridge"
kind = "midi"
inputs = ["DAW (playback)"]
outputs = ["DAW (capture)", "MIDI (capture)"]

[[node]]
name = "Hydrogen"
class = "Stream/Output/Audio"
app = "Hydrogen"
outputs = ["output_FL", "output_FR"]

[[node]]
key = "hydrogen-midi"
name = "Hydrogen MIDI"
class = "Midi/Bridge"
app = "Hydrogen"
kind = "midi"
inputs = ["midi_in"]

[[node]]
name = "Qsynth"
class = "Stream/Output/Audio"
app = "Qsynth"
outputs = ["output_FL", "output_FR"]

[[node]]
key = "qsynth-midi"
name = "Qsynth MIDI"
class = "Midi/Bridge"
app = "Qsynth"
kind = "midi"
inputs = ["midi_in"]

[[node]]
key = "gx-in"
name = "Guitarix Amp"
class = "Stream/Input/Audio"
app = "Guitarix"
inputs = ["in_0"]

[[node]]
key = "gx-out"
name = "Guitarix FX"
class = "Stream/Output/Audio"
app = "Guitarix"
outputs = ["out_0", "out_1"]

[[node]]
key = "eq-in"
name = "x42 Parametric EQ In"
class = "Stream/Input/Audio"
app = "Carla"
link_group = "carla-eq"
inputs = ["input_FL", "input_FR"]

[[node]]
key = "eq-out"
name = "x42 Parametric EQ Out"
class = "Stream/Output/Audio"
app = "Carla"
link_group = "carla-eq"
outputs = ["output_FL", "output_FR"]

[[node]]
key = "comp-in"
name = "LSP Compressor Stereo In"
class = "Stream/Input/Audio"
app = "Carla"
link_group = "carla-comp"
inputs = ["input_FL", "input_FR"]

[[node]]
key = "comp-out"
name = "LSP Compressor Stereo Out"
class = "Stream/Output/Audio"
app = "Carla"
link_group = "carla-comp"
outputs = ["output_FL", "output_FR"]

[[node]]
key = "verb-in"
name = "Dragonfly Hall Reverb In"
class = "Stream/Input/Audio"
app = "Carla"
link_group = "carla-verb"
inputs = ["input_FL", "input_FR"]

[[node]]
key = "verb-out"
name = "Dragonfly Hall Reverb Out"
class = "Stream/Output/Audio"
app = "Carla"
link_group = "carla-verb"
outputs = ["output_FL", "output_FR"]

[[node]]
key = "limit-in"
name = "Calf Limiter In"
class = "Stream/Input/Audio"
app = "Carla"
link_group = "carla-limit"
inputs = ["input_FL", "input_FR"]

[[node]]
key = "limit-out"
name = "Calf Limiter Out"
class = "Stream/Output/Audio"
app = "Carla"
link_group = "carla-limit"
outputs = ["output_FL", "output_FR"]

[[node]]
key = "mon"
name = "Monitor Mix"
class = "Audio/Sink"
inputs = ["playback_FL", "playback_FR"]
monitor = true

[[node]]
key = "hp-a"
name = "Headphone Mix A"
class = "Audio/Sink"
inputs = ["playback_FL", "playback_FR"]
monitor = true

[[node]]
key = "hp-b"
