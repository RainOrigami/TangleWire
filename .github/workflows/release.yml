name: Release

# Pushing a tag like v0.1.0 builds the application and publishes it as a
# GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Built on Debian 13, the oldest system the result is meant to run on:
    # GTK 4.18, libadwaita 1.7, glibc 2.41.
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang pkg-config curl ca-certificates git gh \
            libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          }
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          name="tanglewire-$GITHUB_REF_NAME-x86_64-linux"
          mkdir "$name"
          cp target/release/tanglewire README.md UNLICENSE "$name/"
          cp data/net.codefreak.TangleWire.desktop data/net.codefreak.TangleWire.svg "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" tanglewire-*.tar.gz tanglewire-*.sha256 \
            --title "TangleWire $GITHUB_REF_NAME" --generate-notes

  # Points the AUR package at the release just made. The package itself was
  # put on the AUR by hand; this only moves its version and checksum.
  aur:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git and ssh
        run: pacman -Syu --noconfirm git openssh
      - name: Update the package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          version=${GITHUB_REF_NAME#v}
          keys=$(mktemp -d)
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$keys/key"
          chmod 600 "$keys/key"
          # The host key the AUR publishes on its front page.
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$keys/hosts"
          export GIT_SSH_COMMAND="ssh -i $keys/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$keys/hosts -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/tanglewire.git aur
          cd aur
          sum=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | sha256sum | cut -d ' ' -f 1)
          if [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$version" ]; then
            sed -i "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" PKGBUILD
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo > .SRCINFO'
          chown -R root .

          git diff --quiet && exit 0
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git commit -am "Update to $version"
          git push origin master
